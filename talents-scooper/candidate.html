<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidate · Talents Scooper</title>
  <link rel="icon" href="../shared/img/neuleap-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="app.css">
  <script src="../shared/js/ui.js"></script>
  <script defer src="../shared/vendor/lucide/lucide.min.js"></script>
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="ts">
  <div class="app" data-nav="candidates" data-title="Candidate" data-back="index.html">
    <aside class="sidebar" data-sidebar></aside>
    <div class="main">
      <header class="topbar ts-topbar" data-topbar></header>
      <main class="cand">
        <section class="ccard ccard--profile">
          <button class="add-note" data-open="note-modal"><i data-lucide="square-pen"></i>Add note</button>
          <div class="profile">
            <span class="profile__avatar" id="c-avatar">NL</span>
            <div class="col" style="gap:0">
              <div class="profile__name"><h2 data-c-name>Name LastName</h2><span id="c-id">C1034</span></div>
              <div class="profile__meta">
                <span><i data-lucide="mail"></i><span id="c-email"></span></span>
                <span><i data-lucide="phone"></i><span id="c-phone"></span></span>
                <span><i data-lucide="map-pin"></i><span id="c-location"></span></span>
              </div>
              <div class="profile__actions">
                <button class="btn btn--secondary btn--quiet" id="view-resume">View Resume<i data-lucide="square-arrow-out-up-right"></i></button>
                <button class="btn btn--primary" id="update-btn"><i data-lucide="zap"></i>Update</button>
                <div class="menu update-menu" id="update-menu" data-menu hidden></div>
              </div>
            </div>
          </div>
        </section>

        <details class="ccard" id="audit-card">
          <summary><i data-lucide="layers"></i><span class="ccard__title">Actions Audit Log</span><i data-lucide="chevron-down"></i></summary>
          <div class="ccard__body" id="c-audit" style="gap:0"></div>
        </details>

        <div class="cand-grid">
          <div class="cand-col">
            <details class="ccard" open>
              <summary><i data-lucide="quote"></i><span class="ccard__title">One Line Summary</span><i data-lucide="chevron-down"></i></summary>
              <div class="ccard__body"><p id="c-summary"></p></div>
            </details>
            <details class="ccard" open>
              <summary><i data-lucide="clipboard-list"></i><span class="ccard__title">Analysis Report</span><i data-lucide="chevron-down"></i></summary>
              <div class="ccard__body" id="c-analysis" style="gap:0"></div>
            </details>
          </div>
          <div class="cand-col">
            <details class="ccard" open>
              <summary><i data-lucide="history"></i><span class="ccard__title">Round History</span><i data-lucide="chevron-down"></i></summary>
              <div class="ccard__body" id="c-rounds"></div>
            </details>
            <details class="ccard" open>
              <summary><i data-lucide="award"></i><span class="ccard__title">Certifications</span><i data-lucide="chevron-down"></i></summary>
              <div class="ccard__body" id="c-certs"></div>
            </details>
            <details class="ccard" open>
              <summary><i data-lucide="graduation-cap"></i><span class="ccard__title">Education</span><i data-lucide="chevron-down"></i></summary>
              <div class="ccard__body" id="c-edu"></div>
            </details>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="modal" id="note-modal" role="dialog" aria-labelledby="note-title" aria-hidden="true">
    <div class="modal__header"><div class="grow"><h2 class="t-title" id="note-title">Add note</h2><p class="t-body text-muted">Notes are visible to everyone on the hiring team.</p></div><button class="icon-btn icon-btn--round" data-close aria-label="Close"><i data-lucide="x"></i></button></div>
    <form class="col gap-16" id="note-form">
      <div class="field"><label class="field__label" for="note-text">Note</label><textarea class="input" id="note-text" placeholder="e.g. Strong on RAG, follow up on system design in Round 2" required></textarea></div>
      <div class="row gap-12" style="justify-content:flex-end"><button type="button" class="btn btn--secondary" data-close>Cancel</button><button class="btn btn--primary" type="submit">Save note</button></div>
    </form>
  </div>
</body>
</html>
