<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Talents Scooper</title>
  <link rel="icon" href="../shared/img/neuleap-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="app.css">
  <script src="../shared/js/ui.js"></script>
  <script defer src="../shared/vendor/lucide/lucide.min.js"></script>
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="ts">
  <div class="app" data-nav="dashboard" data-title="Dashboard">
    <aside class="sidebar" data-sidebar></aside>
    <div class="main">
      <header class="topbar ts-topbar" data-topbar></header>
      <main class="ts-panel">
        <div class="ts-panel__head">
          <div class="utabs" id="status-tabs" role="tablist" aria-label="Candidate status"></div>
          <button class="btn btn--primary btn--xs" id="run-pipeline"><i data-lucide="play"></i>Run Pipeline</button>
        </div>
        <div class="ts-scroll" id="status-panel"></div>
      </main>
    </div>
  </div>

</body>
</html>
