<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System permissions · Neuleap Aptitude Test</title>
  <link rel="icon" href="../shared/img/neuleap-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="app.css">
  <script src="../shared/js/ui.js"></script>
  <script defer src="../shared/vendor/lucide/lucide.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-page="permissions">
  <div class="ta">
    <header class="ta-header">
      <a class="logo" href="index.html" aria-label="neuleap.ai"><span class="brand-tile"><img src="../shared/img/neuleap-mark.svg" alt=""></span><span class="wordmark">neuleap<span>.ai</span></span></a>
      <span class="spacer"></span>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
    </header>
    <div class="glow" style="width:700px;height:600px;right:0;top:-200px"></div>
    <main class="ta-main">
      <section class="panel pretest">
        <div class="pretest__intro">
          <p class="pretest__hello">Hi <span data-first-name>Aarav</span>,</p>
          <p class="pretest__welcome">Welcome to</p>
          <h1 class="pretest__name">Neuleap Aptitude Assessment Round 1</h1>
          <div class="pretest__rule"></div>
          <div class="pretest__facts">
            <div class="stat"><span class="stat__label">Question count</span><span class="stat__value">30 Questions</span></div>
            <div class="stat"><span class="stat__label">Section count</span><span class="stat__value">3 Sections</span></div>
            <div class="stat"><span class="stat__label">Test duration</span><span class="stat__value">45 Minutes</span></div>
          </div>
        </div>
        <div class="pretest__flow" id="perm-flow" aria-live="polite"></div>
      </section>
    </main>
    <footer class="ta-footer"><span>Neuleap Online Assessment © 2026</span><span>Need help? Contact <a href="mailto:hiring@neuleap.ai">hiring@neuleap.ai</a></span></footer>
  </div>
</body>
</html>
